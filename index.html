<div class="chatbox">
    <div class="input-area">
        <input id="input" type="text" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
        <button onclick="clearHistory()">Clear</button>
    </div>
    <div id="typing" style="display:none;">🤔 Thinking...</div>
    <div id="history"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const historyEl = document.getElementById('history');
        const typingEl = document.getElementById('typing');
        const inputEl = document.getElementById('input');

        // Check if elements exist before adding listeners to prevent the TypeError
        if (inputEl) {
            inputEl.addEventListener("keyup", function(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });
        } else {
            console.error("Could not find input element with ID 'input'");
        }

        // ... rest of your sendMessage and appendMessage functions ...
    });
</script>
