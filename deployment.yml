apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-chatbot
  namespace: chatbot-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
      - name: chatbot-container
        image: 078083578991.dkr.ecr.ap-south-1.amazonaws.com/chatbot-app:14
        ports:
        - containerPort: 5000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: chatbot-production
spec:
  type: LoadBalancer
  selector:
    app: chatbot
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000