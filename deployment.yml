apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: chatbot-production
spec:
  # Changed from LoadBalancer to NodePort
  type: NodePort 
  selector:
    app: flask-chatbot
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-ingress
  namespace: chatbot-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: "chatbot-api-alb"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:078083578991:certificate/e583e1f8-ee5b-485d-ac94-4eac34d1d887"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  ingressClassName: alb  # <--- THIS IS THE CRITICAL ADDITION
  rules:
    - host: "api.rferns-0009.xyz"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatbot-service
                port:
                  number: 80