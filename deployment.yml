apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-chatbot
  namespace: chatbot-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
      - name: chatbot-container
        image: 078083578991.dkr.ecr.ap-south-1.amazonaws.com/chatbot-app:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # --- FIXED: Probes now use the root '/' path ---
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        # -----------------------------------------------
        ports:
        - containerPort: 5000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: flask-chatbot-service
  namespace: chatbot-production
  labels:
    app: chatbot
spec:
  selector:
    app: chatbot
  ports:
    - name: http-web
      protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort # Required for ALB target groups
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-chatbot-ingress
  namespace: chatbot-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # 1. Open both HTTP and HTTPS listeners
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # 2. Force HTTP traffic to redirect to HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # 3. Attach your SSL Certificate (MUST BE IN ap-south-1)
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-south-1:078083578991:certificate/e583e1f8-ee5b-485d-ac94-4eac34d1d887'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-chatbot-service
                port:
                  number: 80