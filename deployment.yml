apiVersion: v1
kind: Namespace
metadata:
  name: chatbot-production

---
apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
  namespace: chatbot-production
type: Opaque
data:
  # Generate this using: echo -n "YOUR_API_KEY" | base64
  OPENAI_API_KEY: <REPLACE_WITH_BASE64_KEY>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-chatbot
  namespace: chatbot-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
      - name: chatbot-container
        image: <YOUR_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/chatbot-app:latest
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_API_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: chatbot-production
  annotations:
    # This creates the LoadBalancer in your PUBLIC subnets 
    # while the pods stay in PRIVATE subnets.
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: chatbot
  ports:
    - protocol: TCP
      port: 80
      target_port: 5000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatbot-hpa
  namespace: chatbot-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-chatbot
  minReplicas: 1
  maxReplicas: 2 # Matches your "1 to 2 pods" request
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70